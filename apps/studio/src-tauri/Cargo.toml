[package]
name = "project-memory-studio"
version = "0.3.0"
description = "A local desktop workspace for Project Memory"
edition = "2024"
rust-version = "1.100"
license = "MIT"
authors = ["CharlieJamesGwapo"]
repository = "https://github.com/CharlieJamesGwapo/project-memory-mcp"

[lib]
name = "project_memory_studio_lib"
crate-type = ["rlib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-clipboard-manager = "2.5.0"
project-memory-mcp = { path = "../../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync"] }
tempfile = "3"

[dev-dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }

[profile.release]
lto = "thin"
strip = true

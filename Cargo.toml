[package]
name = "project-memory-mcp"
version = "0.5.0"
edition = "2024"
rust-version = "1.100"
description = "Local project memory, explicit decisions, and handoffs for AI assistants over MCP"
license = "MIT"
authors = ["CharlieJamesGwapo"]
repository = "https://github.com/CharlieJamesGwapo/project-memory-mcp"
readme = "README.md"
keywords = ["mcp", "ai", "memory", "sqlite", "skills"]
categories = ["command-line-utilities", "database"]
include = ["/src/**", "/tests/*.rs", "/tests/*_test.py", "/scripts/*.py", "/skills/**", "/examples/**", "/evals/**/*.json", "/evals/**/*.md", "/evals/**/*.py", "/docs/*.md", "/AGENTS.md", "/CHANGELOG.md", "/Cargo.toml", "/Cargo.lock", "/rust-toolchain.toml", "/README.md", "/LICENSE", "/CONTRIBUTING.md", "/SECURITY.md", "/server.json"]

[package.metadata.mcp]
name = "io.github.CharlieJamesGwapo/project-memory"

[dependencies]
base64 = "0.22"
time = { version = "0.3", features = ["formatting", "parsing"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
rmcp = { version = "3.12", default-features = false, features = ["server", "transport-io", "macros", "schemars"] }
rusqlite = { version = "0.43", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "io-std", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
rmcp = { version = "3.12", default-features = false, features = ["client", "transport-child-process"] }

[profile.release]
lto = "thin"
strip = true

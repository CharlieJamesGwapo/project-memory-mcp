[package]
name = "project-memory-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Local project memory, explicit decisions, and handoffs for AI assistants over MCP"
license = "MIT"
authors = ["CharlieJamesGwapo"]
repository = "https://github.com/CharlieJamesGwapo/project-memory-mcp"
readme = "README.md"
keywords = ["mcp", "ai", "memory", "sqlite", "skills"]
categories = ["command-line-utilities", "database"]
include = ["src/**", "tests/**", "skills/**", "examples/**", "docs/publishing.md", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "server.json"]

[package.metadata.mcp]
name = "io.github.charliejamesgwapo/project-memory"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
rmcp = { version = "3.11", features = ["server", "transport-io", "macros", "schemars"] }
rusqlite = { version = "0.38", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "io-std", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
rmcp = { version = "3.11", features = ["client", "transport-child-process"] }

[profile.release]
lto = "thin"
strip = true

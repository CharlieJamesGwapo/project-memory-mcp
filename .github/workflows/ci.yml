name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests including real MCP client
        run: cargo test --locked
      - name: Verify Cargo source package
        run: cargo package --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check archive inventory
        run: python scripts/check-package.py target/package/project-memory-mcp-0.1.0.crate
      - name: Release archive regression tests
        run: python -m unittest discover -s tests -p '*_test.py'

name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests including real MCP client
        run: cargo test --locked
      - name: Verify Cargo source package
        run: cargo package --locked
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Check archive inventory
        shell: bash
        run: |
          python - <<'PYTHON'
          import importlib.util, pathlib, tomllib
          root = pathlib.Path('.')
          package = tomllib.loads((root / 'Cargo.toml').read_text())['package']
          spec = importlib.util.spec_from_file_location('package_check', 'scripts/check-package.py')
          check = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(check)
          check.check(root / 'target' / 'package' / f"{package['name']}-{package['version']}.crate")
          PYTHON
      - name: Release archive regression tests
        run: python -m unittest discover -s tests -p '*_test.py'

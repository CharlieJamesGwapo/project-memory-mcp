name: Studio
on:
  push:
    paths: ['apps/studio/**', 'src/**', 'Cargo.*', 'rust-toolchain.toml', '.github/workflows/studio.yml']
  pull_request:
    paths: ['apps/studio/**', 'src/**', 'Cargo.*', 'rust-toolchain.toml', '.github/workflows/studio.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Native formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Native Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol --all-targets -- -D warnings
      - name: Native service tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol
      - name: Desktop compilation
        run: npm run tauri -- build --debug --no-bundle

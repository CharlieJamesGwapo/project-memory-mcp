name: Publish native release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Prepare release binaries run ID
        required: true
        type: number
permissions:
  contents: read
jobs:
  prepare:
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    env:
      BUILD_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Check source policy
        run: python scripts/check-source-safety.py
      - name: Verify build provenance and unchanged Rust source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          run_id=str(int(os.environ['BUILD_RUN_ID']))
          repository=os.environ['GITHUB_REPOSITORY']
          run=json.loads(subprocess.check_output(['gh','api',f'repos/{repository}/actions/runs/{run_id}']))
          assert run['conclusion']=='success' and run['name']=='Prepare release binaries'
          assert run['event'] in ('workflow_dispatch','push')
          assert run['path']=='.github/workflows/release.yml'
          assert run['head_repository']['full_name']==repository
          sha=run['head_sha']
          subprocess.run(['git','merge-base','--is-ancestor',sha,'HEAD'],check=True)
          subprocess.run(['git','diff','--exit-code',sha,'HEAD','--','src','Cargo.toml','Cargo.lock','rust-toolchain.toml','build.rs','.github/workflows/release.yml','scripts/package-release.py'],check=True)
          print('Verified successful trusted build with matching Rust code and dependencies:',sha)
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: project-memory-mcp-*
          path: native-artifacts
      - name: Verify and extract native archives
        run: |
          python - <<'PY'
          import hashlib,tarfile,zipfile
          from pathlib import Path
          paths=[p for p in Path('native-artifacts').rglob('*') if p.name.endswith(('.tar.gz','.zip'))]
          assert len(paths)==4,paths
          Path('dist-release').mkdir()
          for path in paths:
              expected=Path(str(path)+'.sha256').read_text().split()[0]
              assert hashlib.sha256(path.read_bytes()).hexdigest()==expected,path
              target=Path('native-extracted')/path.parent.name
              target.mkdir(parents=True)
              if path.suffix=='.zip':
                  with zipfile.ZipFile(path) as archive: archive.extractall(target)
              else:
                  with tarfile.open(path) as archive: archive.extractall(target,filter='data')
          PY
      - name: Combine macOS architectures and stage bundle
        run: |
          python - <<'PY'
          import subprocess,tomllib
          from pathlib import Path
          version=tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          def binary(target,filename='project-memory-mcp'):
              root=Path('native-extracted')/f'project-memory-mcp-{target}'/f'project-memory-mcp-{version}-{target}'
              return str(root/filename)
          Path('universal').mkdir()
          mac='universal/project-memory-mcp'
          subprocess.run(['lipo','-create',binary('aarch64-apple-darwin'),binary('x86_64-apple-darwin'),'-output',mac],check=True)
          Path(mac).chmod(0o755)
          subprocess.run(['lipo','-info',mac],check=True)
          for target in ('aarch64-apple-darwin','x86_64-apple-darwin','x86_64-unknown-linux-gnu','x86_64-pc-windows-msvc'):
              filename='project-memory-mcp.exe' if 'windows' in target else 'project-memory-mcp'
              subprocess.run(['python','scripts/package-release.py','--target',target,'--binary',binary(target,filename),'--output','dist-release'],check=True)
          subprocess.run(['python','scripts/package-mcpb.py','--macos-universal',mac,'--linux-x64',binary('x86_64-unknown-linux-gnu'),'--windows-x64',binary('x86_64-pc-windows-msvc','project-memory-mcp.exe'),'--output-dir','bundle-staging'],check=True)
          with open('bundle.env','w') as output: output.write(f'RELEASE_VERSION={version}\n')
          PY
      - name: Validate, ZIP and unpack the generated MCPB contract
        run: |
          source bundle.env
          python scripts/package-mcpb.py --pack bundle-staging --archive "dist-release/project-memory-mcp-${RELEASE_VERSION}.mcpb"
          python scripts/package-mcpb.py --unpack "dist-release/project-memory-mcp-${RELEASE_VERSION}.mcpb" --output-dir bundle-unpacked
      - name: Smoke-test actual unpacked bundle
        run: python scripts/smoke-test.py bundle-unpacked/server/darwin/project-memory-mcp
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - name: Install the desktop build toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --target aarch64-apple-darwin
      - name: Test and build the macOS arm64 Studio preview
        working-directory: apps/studio
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/studio
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol
          npm run tauri -- build --target aarch64-apple-darwin --bundles app
      - name: Package the desktop preview with its guide and licenses
        run: |
          source bundle.env
          mkdir -p studio-preview/licenses
          ditto "target/studio/aarch64-apple-darwin/release/bundle/macos/Project Memory Studio.app" "studio-preview/Project Memory Studio.app"
          cp docs/studio-download-readme.md studio-preview/README.md
          cp LICENSE studio-preview/LICENSE
          cp apps/studio/public/licenses/*.txt studio-preview/licenses/
          ditto -c -k --keepParent studio-preview "dist-release/project-memory-studio-${RELEASE_VERSION}-macos-arm64.zip"
      - name: Generate exact Registry metadata and checksums
        id: metadata
        run: |
          python - <<'PY'
          import hashlib,json,os,shutil,tomllib
          from pathlib import Path
          version=tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          bundle=Path('dist-release')/f'project-memory-mcp-{version}.mcpb'
          metadata=json.loads(Path('server.json').read_text())
          assert metadata['name']=='io.github.CharlieJamesGwapo/project-memory'
          metadata['packages']=[{'registryType':'mcpb','identifier':f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/v{version}/{bundle.name}','fileSha256':hashlib.sha256(bundle.read_bytes()).hexdigest(),'transport':{'type':'stdio'}}]
          Path('dist-release/server.mcpb.json').write_text(json.dumps(metadata,indent=2)+'\n')
          files=sorted(p for p in Path('dist-release').iterdir() if p.is_file())
          Path('dist-release/SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          shutil.copyfile(f'docs/releases/{version}.md','release-notes.md')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write(f'version={version}\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prepared-release-assets
          path: |
            dist-release/
            release-notes.md
          if-no-files-found: error
          retention-days: 7
  attest:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prepared-release-assets
          path: prepared
      - name: Attest the exact release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: prepared/dist-release/*
  publish:
    needs: [prepare, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prepared-release-assets
          path: prepared
      - name: Verify provenance and publish a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for bundle in prepared/dist-release/*.mcpb; do
            gh attestation verify "$bundle" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-native-release.yml" \
              --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
          gh release create "v${RELEASE_VERSION}" prepared/dist-release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Project Memory MCP ${RELEASE_VERSION}" \
            --notes-file prepared/release-notes.md

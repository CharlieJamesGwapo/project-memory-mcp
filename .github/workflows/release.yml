name: Prepare release binaries
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.100.0 --profile minimal --target ${{ matrix.target }}
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage release files
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p release
          cp target/"$RELEASE_TARGET"/release/project-memory-mcp* release/
          cp README.md LICENSE server.json release/
          cp -R skills examples docs release/
          rm -f release/*.d release/*.pdb
      - uses: actions/upload-artifact@v4
        with:
          name: project-memory-mcp-${{ matrix.target }}
          path: release/
          if-no-files-found: error

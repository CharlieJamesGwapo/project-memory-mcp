name: Publish MCP Registry listing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check source policy
        run: python3 scripts/check-source-safety.py
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Download and verify official MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Verify exact metadata and attested bundle from the new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          gh release download "v${version}" --repo "$GITHUB_REPOSITORY" \
            --pattern server.mcpb.json --pattern "project-memory-mcp-${version}.mcpb" --dir registry-assets
          gh attestation verify "registry-assets/project-memory-mcp-${version}.mcpb" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-native-release.yml" \
            --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          python3 - <<'PY'
          import hashlib,json,os,tomllib
          from pathlib import Path
          version=tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          metadata=json.loads(Path('registry-assets/server.mcpb.json').read_text())
          bundle=Path('registry-assets')/f'project-memory-mcp-{version}.mcpb'
          assert metadata['name']=='io.github.CharlieJamesGwapo/project-memory'
          assert metadata['version']==version
          assert metadata['packages']==[{
              'registryType':'mcpb',
              'identifier':f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/v{version}/{bundle.name}',
              'fileSha256':hashlib.sha256(bundle.read_bytes()).hexdigest(),
              'transport':{'type':'stdio'}}]
          PY
      - name: Validate GitHub-hosted binary listing
        run: ./mcp-publisher validate registry-assets/server.mcpb.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-registry-publication
          path: |
            mcp-publisher
            registry-assets/server.mcpb.json
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-registry-publication
          path: verified
      - name: Authenticate and publish with GitHub Actions identity
        run: |
          chmod +x verified/mcp-publisher
          verified/mcp-publisher login github-oidc
          verified/mcp-publisher publish verified/registry-assets/server.mcpb.json
